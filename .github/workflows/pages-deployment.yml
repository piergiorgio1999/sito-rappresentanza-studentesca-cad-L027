name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN. Add an account-scoped Cloudflare API token with Pages Edit permission."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID. Add the Cloudflare account ID for the Pages project."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Pages configuration
        id: cfg
        run: |
          set -Eeuo pipefail
          # Nei progetti generati da copier il file è config/template/pages.json;
          # in questo repository template vale la copia statica di riserva.
          config="config/template/pages.json"
          [[ -f "$config" ]] || config="config/template/pages.template-repo.json"
          [[ -f "$config" ]] || { echo "File di configurazione Pages mancante"; exit 1; }
          site_dir="$(jq -r '.siteDir // empty' "$config")"
          project="$(jq -r '.cloudflareProject // empty' "$config")"
          [[ -n "$site_dir" ]] || { echo "siteDir non definito in $config"; exit 1; }
          [[ -n "$project" ]] || { echo "cloudflareProject non definito in $config"; exit 1; }
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Deploy site to Cloudflare Pages
        # One-time setup: create an account-scoped Cloudflare API token with Pages Edit permission,
        # then add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          workingDirectory: ${{ steps.cfg.outputs.site_dir }}
          command: pages deploy . --project-name=${{ steps.cfg.outputs.project }} --branch=main
          githubToken: ${{ github.token }}
