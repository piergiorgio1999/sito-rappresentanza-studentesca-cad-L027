name: Preview Cloudflare Pages

# Anteprima automatica del sito per ogni PR che tocca la cartella del sito
# (letta da config/template/pages.json: un filtro `paths:` non può essere
# parametrico, quindi il controllo avviene a runtime sui file della PR).
# Pubblica su un ramo di anteprima (pr-<numero>) del progetto Pages: la produzione
# resta riservata a pages-deployment.yml, che parte solo dal push su main.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # I secrets non sono disponibili alle PR da fork: lì l'anteprima non parte.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Pages configuration
        id: cfg
        run: |
          set -Eeuo pipefail
          # Nei progetti generati da copier il file è config/template/pages.json;
          # in questo repository template vale la copia statica di riserva.
          config="config/template/pages.json"
          [[ -f "$config" ]] || config="config/template/pages.template-repo.json"
          [[ -f "$config" ]] || { echo "File di configurazione Pages mancante"; exit 1; }
          site_dir="$(jq -r '.siteDir // empty' "$config")"
          project="$(jq -r '.cloudflareProject // empty' "$config")"
          [[ -n "$site_dir" ]] || { echo "siteDir non definito in $config"; exit 1; }
          [[ -n "$project" ]] || { echo "cloudflareProject non definito in $config"; exit 1; }
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Check whether the site changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_DIR: ${{ steps.cfg.outputs.site_dir }}
        run: |
          set -Eeuo pipefail
          count="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | grep -c "^$SITE_DIR/" || true)"
          if [[ "$count" -gt 0 ]]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "Nessun file sotto $SITE_DIR/ in questa PR: anteprima saltata."
          fi

      - name: Check Cloudflare credentials
        if: steps.changed.outputs.site == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing repository secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        if: steps.changed.outputs.site == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          workingDirectory: ${{ steps.cfg.outputs.site_dir }}
          command: pages deploy . --project-name=${{ steps.cfg.outputs.project }} --branch=pr-${{ github.event.pull_request.number }}
          githubToken: ${{ github.token }}

      - name: Report preview URL
        if: steps.changed.outputs.site == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          {
            echo "### Anteprima del sito"
            echo
            echo "- Indirizzo stabile della PR: ${PREVIEW_URL:-non disponibile}"
            echo "- Questo commit: ${DEPLOYMENT_URL:-non disponibile}"
          } >> "$GITHUB_STEP_SUMMARY"
